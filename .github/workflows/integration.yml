name: Integration (real language servers)

# Deliberately not on pull_request. Two intermittent failures were observed
# during development and never reproduced; a suite that fails unpredictably
# must not block merges, because that trains everyone to re-run until green.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Every server is pinned, so a green run says what it was green against and a
  # failure can be bisected against a version change. Bump these deliberately.
  VTSLS_VERSION: "0.3.0"
  BASEDPYRIGHT_VERSION: "1.40.1"
  GOPLS_VERSION: "v0.23.0"
  # Ubuntu noble ships clangd 18.1.3, which answers callHierarchy/outgoingCalls
  # with "method not found" -- it never implemented that half of call hierarchy.
  CLANGD_VERSION: "23.1.0"
  CLANGD_SHA256: "e53b1a96196095faedb7642cf64964f7fb9ad4a0c1f00dd2c172a3d9dcbafdfd"

jobs:
  integration:
    runs-on: ubuntu-latest
    # A hung language server would otherwise burn the 6-hour default, and a
    # job cancelled by timeout does not run `if: failure()` — so the evidence
    # this workflow exists to capture would be lost exactly when it matters.
    # Worst legitimate case is ~25min (5 servers x the 300s readiness budget)
    # plus installs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-analyzer
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install language servers
        run: |
          set -euxo pipefail
          npm install -g "@vtsls/language-server@${VTSLS_VERSION}"
          pip install "basedpyright==${BASEDPYRIGHT_VERSION}"
          go install "golang.org/x/tools/gopls@${GOPLS_VERSION}"

          curl -fsSL -o /tmp/clangd.zip \
            "https://github.com/clangd/clangd/releases/download/${CLANGD_VERSION}/clangd-linux-${CLANGD_VERSION}.zip"
          # Verify before unzipping: the suite executes this archive, and a
          # version tag alone does not prove the bytes are the ones intended.
          echo "${CLANGD_SHA256}  /tmp/clangd.zip" | sha256sum -c -
          unzip -q /tmp/clangd.zip -d "$HOME"
          echo "$HOME/clangd_${CLANGD_VERSION}/bin" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Record server versions
        run: |
          set -x
          rust-analyzer --version
          vtsls --version || true
          basedpyright-langserver --version || true
          "$HOME/go/bin/gopls" version
          clangd --version
          go version

      # --test-threads=1 because five servers starting at once contend for CPU
      # and make timings unreliable. --nocapture and tee because the whole
      # point of this workflow is that a failure leaves evidence behind.
      # No LSPGRAPH_SERVERS_TOML here on purpose: the suite falls back to the
      # committed servers.toml, whose bare command names are already correct
      # for a runner where every server is on PATH. Writing a CI-only copy
      # would mean a sixth language could be added to one and not the other.
      - name: Integration suite
        run: |
          set -o pipefail
          cargo test -p lspgraph-core --test integration_servers -- \
            --test-threads=1 --nocapture 2>&1 | tee integration.log

      - name: Upload the full log when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-log
          path: integration.log
          # The default run-log retention is 90 days; a shorter window here
          # would throw away the detail first.
          retention-days: 90
