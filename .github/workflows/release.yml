name: Release

on:
  push:
    tags: ["v*"]
  # Re-run a release without touching a published tag -- to republish after a
  # failed job, or to add assets to a release that predates them. Dispatch it
  # against the tag ref; the guard below still checks that tag against the
  # manifests, so this cannot publish a mislabelled binary.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Publishing a binary labelled with a version it was not built from is worse
  # than publishing nothing, so this runs before anything is built.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag's version core must match the crate version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          core="${tag%%-*}"          # v0.1.0-rc1 -> 0.1.0 ; v0.1.0 -> 0.1.0
          # Both manifests carry a literal version; neither inherits from the
          # workspace. Checking only one lets the two drift apart and still ship.
          for manifest in crates/lspgraph-core/Cargo.toml crates/lspgraph-tui/Cargo.toml; do
            crate=$(grep -m1 '^version' "$manifest" | sed -E 's/.*"(.*)".*/\1/')
            echo "tag=$tag core=$core $manifest=$crate"
            if [ -z "$crate" ]; then
              echo "::error::no literal version found in $manifest"
              exit 1
            fi
            if [ "$core" != "$crate" ]; then
              echo "::error::tag $tag does not match $manifest version $crate"
              exit 1
            fi
          done

  build:
    needs: guard
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Every dependency is pure Rust, so a musl build needs no musl-gcc — but
      # cross-linking for aarch64 still needs a linker rustc can drive.
      - name: Use rust-lld for the aarch64 musl cross build
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=rust-lld" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release -p lspgraph-tui --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          set -euo pipefail
          name="lspgraph-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/lspgraph" "$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar czf "$name.tar.gz" "$name"

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $name = "lspgraph-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/lspgraph.exe" $name
          Copy-Item README.md,LICENSE-MIT,LICENSE-APACHE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  # Distro packages, built from the same static musl binary as the archives, so
  # they carry no shared-library dependencies and install on any release of a
  # distribution rather than only the one they were built on.
  packages:
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: pkg-${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Use rust-lld for the aarch64 musl cross build
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=rust-lld" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release -p lspgraph-tui --target ${{ matrix.target }}

      # --no-build so the package wraps the binary just built above, rather than
      # triggering a second compile with different flags.
      - name: Package
        run: |
          set -euo pipefail
          cargo deb -p lspgraph-tui --target ${{ matrix.target }} --no-build
          cargo generate-rpm -p crates/lspgraph-tui --target ${{ matrix.target }}
          mkdir -p dist
          find target -name '*.deb' -o -name '*.rpm' | while read -r f; do
            echo "packaged $f"
            cp "$f" dist/
          done
          ls -1 dist

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    permissions:
      contents: write
    needs: [build, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Asset names embed the version, so releases/latest/download/<name> can
      # never resolve. Ship a second, unversioned copy of each archive to give
      # every target one URL that keeps working across releases.
      - name: Unversioned copies, for a permanent download URL
        run: |
          set -euo pipefail
          cd dist
          for f in lspgraph-"$GITHUB_REF_NAME"-*; do
            case "$f" in
              *.tar.gz) ext=.tar.gz ;;
              *.zip)    ext=.zip ;;
              *)        continue ;;
            esac
            base=${f%"$ext"}
            cp "$f" "lspgraph-${base#lspgraph-$GITHUB_REF_NAME-}$ext"
          done
          ls -1

      # Runs after the copies exist, so the sums cover what people download by
      # either name.
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: A hyphenated tag is a pre-release by semver
        id: relkind
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.relkind.outputs.prerelease }}
