name: Update the Homebrew tap

# The formula pins a version and four checksums, so it goes stale the moment a
# release is cut. Regenerating it from the release's own SHA256SUMS keeps the
# tap correct without anyone editing four hashes by hand.
#
# Called by the release workflow once the release exists, and dispatchable
# against a tag to retry. NOT triggered by `release: published`: GitHub does not
# raise workflow-triggering events for actions taken with GITHUB_TOKEN, so a
# release created by the release workflow never fires that event.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  formula:
    # A hyphen in the tag means a pre-release by semver. Publishing one would
    # make it the version `cargo add` resolves to.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Build the formula from the release's checksums
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          base="https://github.com/kpanuragh/lspgraph/releases/download/${tag}"

          curl -fsSL -o SHA256SUMS "${base}/SHA256SUMS"
          sum() {
            # Match the versioned name exactly, so the unversioned copy of the
            # same archive cannot be picked up instead.
            awk -v n="lspgraph-${tag}-$1.tar.gz" '$2 == n { print $1 }' SHA256SUMS
          }
          mac_arm=$(sum aarch64-apple-darwin)
          mac_x86=$(sum x86_64-apple-darwin)
          lin_arm=$(sum aarch64-unknown-linux-musl)
          lin_x86=$(sum x86_64-unknown-linux-musl)
          for v in "$mac_arm" "$mac_x86" "$lin_arm" "$lin_x86"; do
            if [ -z "$v" ]; then
              echo "::error::a checksum was missing from ${tag} SHA256SUMS"
              exit 1
            fi
          done

          mkdir -p out/Formula
          cat > out/Formula/lspgraph.rb <<RB
          class Lspgraph < Formula
            desc "Explore a codebase's call graph through any LSP server"
            homepage "https://github.com/kpanuragh/lspgraph"
            version "${version}"
            license any_of: ["MIT", "Apache-2.0"]

            on_macos do
              on_arm do
                url "${base}/lspgraph-${tag}-aarch64-apple-darwin.tar.gz"
                sha256 "${mac_arm}"
              end
              on_intel do
                url "${base}/lspgraph-${tag}-x86_64-apple-darwin.tar.gz"
                sha256 "${mac_x86}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/lspgraph-${tag}-aarch64-unknown-linux-musl.tar.gz"
                sha256 "${lin_arm}"
              end
              on_intel do
                url "${base}/lspgraph-${tag}-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${lin_x86}"
              end
            end

            def install
              bin.install "lspgraph"
            end

            def caveats
              <<~EOS
                lspgraph drives a language server; it does not bundle one. Install the
                server for the language you want and describe it in servers.toml:

                  https://github.com/kpanuragh/lspgraph#configuration

                Validated against rust-analyzer, vtsls, basedpyright, gopls and clangd.
              EOS
            end

            test do
              # With no arguments the binary prints its usage line and exits non-zero.
              assert_match "usage: lspgraph", shell_output("#{bin}/lspgraph 2>&1", 1)
            end
          end
          RB
          ruby -c out/Formula/lspgraph.rb

      # A deploy key rather than a personal access token: it grants write to
      # this one repository and nothing else on the account, and it is the only
      # credential this workflow holds.
      - name: Push it to the tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not set; cannot update the tap"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"

          git clone --depth 1 git@github.com:kpanuragh/homebrew-tap.git tap
          cp out/Formula/lspgraph.rb tap/Formula/lspgraph.rb
          cd tap
          if git diff --quiet; then
            echo "formula already matches ${GITHUB_REF_NAME}; nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -aqm "lspgraph ${GITHUB_REF_NAME}"
          git push
